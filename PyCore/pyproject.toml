[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pycore"
version = "0.1.0"
description = "PyCore — document conversion, time utilities, HTTP exceptions, and office tooling"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rohtash Lakra", email = "rslakra@ameyllc.com" }]
dependencies = [
    "leapseconddata",
    "python-docx",
    "markdown",
    "pdf2docx",
    "docx2pdf",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
pycore-convert = "core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "office*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
