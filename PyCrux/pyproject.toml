[build-system]
requires = ["setuptools >= 77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyCrux"
# The version is generated by version.sh from the git commit count; `make` writes it to
# the (git-ignored) VERSION file before every build or install.
dynamic = ["version"]
authors = [
  { name = "Rohtash Lakra", email = "rohtash.singh@gmail.com" },
]
description = "Python utilities: enums, logging, I/O helpers, thread contexts, HTTP exceptions, document conversion, time and office tooling."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["utilities", "enums", "core", "pycrux", "converter", "logging", "office"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]
# pycrux.converter / pycrux.cli — markdown, Word and PDF conversion
convert = [
    "python-docx",
    "markdown",
    "pdf2docx",
    "docx2pdf",
]
# pycrux.datetime — leap-second-aware UTC/TAI conversions
time = ["leapseconddata>=4.1"]
all = [
    "python-dotenv>=1.0",
    "python-docx",
    "markdown",
    "pdf2docx",
    "docx2pdf",
    "leapseconddata>=4.1",
]
dev = [
    "build>=1.2",
    "twine>=6.0",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "python-dotenv>=1.0",
    "python-docx",
    "markdown",
    "pdf2docx",
    "docx2pdf",
    "leapseconddata>=4.1",
]

[project.scripts]
pycrux-convert = "pycrux.cli:main"

[project.urls]
Homepage = "https://github.com/rslakra/PyCrux"
Issues = "https://github.com/rslakra/PyCrux/issues"
Source = "https://github.com/rslakra/PyCrux"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pycrux*"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.package-data]
pycrux = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    # pdf2docx -> PyMuPDF ships SWIG types without __module__; Python 3.14 flags them. Third-party, not ours.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
