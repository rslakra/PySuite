[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytools"
version = "0.1.0"
description = "PySuite monorepo migration index and project routing helpers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Rohtash Lakra", email = "rslakra@ameyllc.com" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["pytools*"]
